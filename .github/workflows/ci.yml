name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build:data
      - name: Name-day data is up to date
        run: git diff --exit-code src/data/namedays.json
      - run: npm run typecheck
      - run: npm test
