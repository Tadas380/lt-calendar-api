services:
  - type: web
    name: lt-calendar-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.18.0
      - key: TRUST_PROXY
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
